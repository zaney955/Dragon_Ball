name: Validate game
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run architecture:check
      - run: npm run test:unit

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'full' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [full, offline, online]
    name: Browser (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
